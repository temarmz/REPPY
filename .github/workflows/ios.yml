name: REPPY iOS

on:
  pull_request:
    paths: ['ios/**', 'app/reppy-data.ts', 'app/ui/tokens.css', '.github/workflows/ios.yml', 'package.json', 'package-lock.json']
  push:
    branches: ['main']
    paths: ['ios/**', 'app/reppy-data.ts', 'app/ui/tokens.css', '.github/workflows/ios.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-checks:
    name: iOS (${{ matrix.suite }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [core-and-smoke, notes, workout, ledger, student-and-editor]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: matrix.suite == 'core-and-smoke'
        with:
          node-version: 22
      - name: Check shared web contract and generated project
        if: matrix.suite == 'core-and-smoke'
        run: npm run ios:check
      - name: Select iOS 26 SDK
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Test native domain
        if: matrix.suite == 'core-and-smoke'
        run: npm run ios:test
      - name: Select available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          phones = [(runtime, device) for runtime, entries in devices.items() for device in entries if 'iOS-' in runtime and int(runtime.split('iOS-')[1].split('-')[0]) >= 18 and device['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No iOS 18+ iPhone simulator installed')
          selected = max(phones, key=lambda item: (tuple(int(part) for part in item[0].split('iOS-')[1].split('-')), item[1]['name']))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('REPPY_SIMULATOR=' + selected[1]['udid'] + '\n')
          PY
      - name: Wait for iPhone simulator readiness
        run: xcrun simctl bootstatus "$REPPY_SIMULATOR" -b
      - name: Build and run iPhone tests
        shell: bash
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          notes=(
            testNotesAndInstructionParity
            testNotesAndInstructionsLargestText
            testNativeInstructionToolbarWithLargestText
          )
          workout=(
            testActiveWorkoutKeyboardAndFinishOnSmallScreen
            testActiveWorkoutWithLargestText
            testWorkoutScreenParity
          )
          ledger=(
            testLedgerAndInvitationLargestText
            testLedgerAndInvitationParity
            testPaymentFormOpensFromHistory
          )
          student_and_editor=(
            testNativeRepeatReorderAndDraftExit
            testStudentManagementLargestText
            testStudentManagementParity
            testWorkoutEditorSetRows
          )
          smoke_class=REPPYUITests/SmokeTests
          case "$TEST_SUITE" in
            notes) tests=("${notes[@]}") ;;
            workout) tests=("${workout[@]}") ;;
            ledger) tests=("${ledger[@]}") ;;
            student-and-editor) tests=("${student_and_editor[@]}") ;;
            core-and-smoke)
              set -- -skip-testing:REPPYUITests/ScreenAuditTests
              tests=("${notes[@]}" "${workout[@]}" "${ledger[@]}" "${student_and_editor[@]}")
              ;;
          esac
          for test in "${tests[@]}"; do
            if [ "$TEST_SUITE" = core-and-smoke ]; then
              set -- "$@" "-skip-testing:$smoke_class/$test"
            else
              set -- "$@" "-only-testing:$smoke_class/$test"
            fi
          done
          run_tests() {
            xcodebuild test -project ios/REPPY.xcodeproj -scheme REPPY "$@" \
              -destination "platform=iOS Simulator,id=$REPPY_SIMULATOR" -parallel-testing-enabled NO \
              -derivedDataPath ios/DerivedData -resultBundlePath ios/TestResults.xcresult \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
              REPPY_RELEASE=ios-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          }
          test_log="$RUNNER_TEMP/reppy-xcodebuild.log"
          if run_tests "$@" 2>&1 | tee "$test_log"; then
            exit 0
          else
            test_status=$?
          fi
          if ! grep -Fq 'operation never finished bootstrapping' "$test_log" || grep -Eq '^Test (Case|Suite) ' "$test_log"; then
            exit "$test_status"
          fi
          echo "::warning::XCTest runner exited before starting tests. Rebooting the simulator and retrying once."
          if [ -d ios/TestResults.xcresult ]; then
            mv ios/TestResults.xcresult ios/TestBootstrapFailure.xcresult
          fi
          xcrun simctl shutdown "$REPPY_SIMULATOR"
          xcrun simctl bootstatus "$REPPY_SIMULATOR" -b
          run_tests "$@"
      - name: Package simulator demo
        if: matrix.suite == 'core-and-smoke'
        run: ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/REPPY.app ios/REPPY-simulator.zip
      - name: Preserve simulator demo
        if: matrix.suite == 'core-and-smoke'
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-demo
          path: ios/REPPY-simulator.zip
      - name: Export test screenshots
        if: always()
        run: |
          if [ -f ios/TestResults.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path ios/TestResults.xcresult --output-path ios/TestAttachments
          fi
      - name: Preserve simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ matrix.suite }}
          path: |
            ios/TestResults.xcresult
            ios/TestBootstrapFailure.xcresult
            ios/TestAttachments
          if-no-files-found: ignore
