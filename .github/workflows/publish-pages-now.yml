name: Publish REPPY to Pages now

on:
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: pages-now-main
  cancel-in-progress: true

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-now]')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pages.yml
    with:
      quick-checks: true
