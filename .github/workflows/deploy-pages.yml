name: Web CI and standard Pages release

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase
        run: npm run supabase:start
      - name: Lint database schema
        run: npm run db:lint
      - name: Test database functions and policies
        run: npm run db:test
      - name: Test two-account Auth workflow
        run: npm run test:integration
      - name: Restore backup in a disposable isolated database
        run: npm run ops:restore-drill
      - name: Preserve restore drill report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: restore-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/ops-restore-*/report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop isolated Supabase
        if: always()
        run: npm run supabase:stop

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test data model
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium webkit
      - name: Build site for WebKit operations
        run: npm run build:pages
      - name: Check WebKit history and recovery operations
        run: npm run test:ops:web
      - name: Rehearse immutable static rollback
        run: npm run ops:rollback-drill
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-operations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/ops-browser-artifacts/
            work/ops-browser-report.json
            work/ops-rollback/report.json
          if-no-files-found: ignore
          retention-days: 14

  browser-tests:
    name: Playwright (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers for end-to-end tests
        run: npx playwright install --with-deps chromium webkit
      - name: Build and run end-to-end tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [backend-integration, frontend-checks, browser-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[publish-now]')))
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pages.yml
