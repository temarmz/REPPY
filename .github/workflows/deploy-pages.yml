name: Deploy REPPY to GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase
        run: npm run supabase:start
      - name: Lint database schema
        run: npm run db:lint
      - name: Test database functions and policies
        run: npm run db:test
      - name: Test two-account Auth workflow
        run: npm run test:integration
      - name: Restore backup in a disposable isolated database
        run: npm run ops:restore-drill
      - name: Preserve restore drill report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: restore-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/ops-restore-*/report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop isolated Supabase
        if: always()
        run: npm run supabase:stop

  frontend-checks:
    needs: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test data model
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium webkit
      - name: Build and run end-to-end tests
        run: npm run test:e2e
      - name: Check WebKit history and recovery operations
        run: npm run test:ops:web
      - name: Rehearse immutable static rollback
        run: npm run ops:rollback-drill
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            work/ops-browser-artifacts/
            work/ops-browser-report.json
            work/ops-rollback/report.json
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: frontend-checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[publish-now]')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Supabase-connected Pages artifact
        run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Package immutable rollback artifact
        run: |
          node scripts/release-artifact.mjs create pages-dist release-manifest.json
          tar -czf reppy-release.tar.gz pages-dist release-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: reppy-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: reppy-release.tar.gz
          retention-days: 35
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  # Explicitly requested test publication; the full checks above still run.
  publish-now:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-now]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build Supabase-connected Pages artifact
        run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Package immutable rollback artifact
        run: |
          node scripts/release-artifact.mjs create pages-dist release-manifest.json
          tar -czf reppy-release.tar.gz pages-dist release-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: reppy-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: reppy-release.tar.gz
          retention-days: 35
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
