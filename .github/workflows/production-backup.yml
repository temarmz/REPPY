name: Backup production Supabase

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create and verify production backup
    runs-on: ubuntu-latest
    environment: production-ops
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create logical database and Storage backup
        env:
          SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
          REPPY_BACKUP_DIR: ${{ runner.temp }}/reppy-backup
        run: npm run backup:create
      - name: Verify backup checksums
        env:
          REPPY_BACKUP_DIR: ${{ runner.temp }}/reppy-backup
        run: npm run backup:verify
      - name: Encrypt and verify backup before artifact upload
        env:
          REPPY_BACKUP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BACKUP_ENCRYPTION_KEY }}
        run: |
          tar -czf "$RUNNER_TEMP/reppy-backup.tar.gz" -C "$RUNNER_TEMP/reppy-backup" .
          node scripts/encrypt-backup.mjs encrypt "$RUNNER_TEMP/reppy-backup.tar.gz" "$RUNNER_TEMP/reppy-backup.tar.gz.enc"
          node scripts/encrypt-backup.mjs decrypt "$RUNNER_TEMP/reppy-backup.tar.gz.enc" "$RUNNER_TEMP/verified-backup.tar.gz"
          cmp "$RUNNER_TEMP/reppy-backup.tar.gz" "$RUNNER_TEMP/verified-backup.tar.gz"
          rm "$RUNNER_TEMP/reppy-backup.tar.gz" "$RUNNER_TEMP/verified-backup.tar.gz"
      - name: Store encrypted backup in GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          name: production-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reppy-backup.tar.gz.enc
          if-no-files-found: error
          retention-days: 35
